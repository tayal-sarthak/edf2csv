<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Front-loads the phrase people actually search; the H1 keeps the site's own voice. -->
    <title>Convert EDF to CSV from the command line - edf2csv</title>
    <meta
      name="description"
      content="Convert EDF, EDF+ and BDF recordings - EEG, ECG, sleep studies - to CSV with one command. Local, streaming, and verified bit-for-bit against pyEDFlib."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0d0b" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fcfbf9" />
    <meta name="robots" content="max-image-preview:large" />
    <!-- Restores a chosen theme before first paint, so a light-mode reader never sees a dark flash.
         The same script is inlined into every prerendered documentation page. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('edf2csv-theme');
          if (t && t !== 'auto') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/SpaceGrotesk.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/JetBrainsMono.woff2" crossorigin />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Vercel Web Analytics. Cookieless and aggregate; it records page views, not people.
         Inert until Analytics is enabled for the project in the Vercel dashboard. -->
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

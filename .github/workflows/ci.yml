name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a pull request leaves the first run going: three Node versions of the suite
# plus seven sweeps, all proving things about a commit nobody will merge, while the run that
# matters queues behind them.
# Keyed by ref, so pushes to a branch supersede each other and main is left alone — a run on
# main is the one that says whether the released commit is good, and cancelling it would
# leave that question unanswered.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  core:
    strategy:
      matrix:
        node-version: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The correctness page names seven sweeps as how this project knows what it claims, and
  # until now nothing ran any of them on a push: `npm test` covers the suite and not the
  # harnesses, so a regression in an invariant only a sweep checks shipped in silence.
  #
  # Its own job rather than steps on `core`, because these take minutes where the suite takes
  # one, and GitHub runs jobs concurrently — the pull request waits for the slowest, not the
  # sum. One Node version is enough: these assert what the tool computes, and `core` is what
  # covers computing it on both.
  sweeps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run fixtures
      # Each on its own line so a failure names the invariant that broke rather than "sweeps".
      - name: Estimates never read under what is written
        run: node test/fuzz/estimate.mjs
      - name: The two layouts hold the same samples
        run: node test/fuzz/layouts.mjs
      - name: Digital codes survive the round trip
        run: node test/fuzz/roundtrip.mjs
      - name: Narrowing returns the part it names
        run: node test/fuzz/narrowing.mjs
      - name: A damaged file is reported, never a crash
        run: node test/fuzz/mutate.mjs
      - name: A batch converts each recording as converting it alone would
        run: node test/fuzz/trees.mjs

  # Every check above runs against the working tree. Twice now the thing that was broken was
  # the tarball: 0.5.30 published four files and no `dist/`, and 0.6.117 shipped a manifest
  # whose `bin` pointed at a file no hook was building. Both looked fine from inside the
  # repository, because inside the repository `npm test` had just built it.
  #
  # So this packs the package and installs it somewhere else, the way anybody else gets it,
  # and then asks it the two questions a consumer asks: does the command run, and does the
  # library import. Neither can pass on a tarball with no code in it.
  tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pack it, install it elsewhere, and use it
        run: |
          set -euo pipefail
          tarball="$GITHUB_WORKSPACE/$(npm pack --silent)"
          expected="$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$tarball"
          got="$(./node_modules/.bin/edf2csv --version)"
          [ "$got" = "$expected" ] || { echo "the installed binary reports $got, not $expected"; exit 1; }
          node -e "import('edf2csv').then(m => { for (const name of ['convert', 'EdfFile', 'parseHeader']) if (typeof m[name] !== 'function') { console.error(name + ' is not exported by the installed package'); process.exit(1); } })"

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website

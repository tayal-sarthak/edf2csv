name: Publish to npm

# Publishing is deliberately manual: it fires when a GitHub Release is published,
# not on every push to main. Releasing is irreversible, so it should be a decision.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance. This is what lets npm attest that the tarball
      # really was built from this repository at this commit, which is worth having
      # for a tool whose selling point is that you can trust its numbers.
      id-token: write

    # Actions are pinned by commit SHA rather than by tag, and it matters most here. This job
    # publishes with npm provenance — an attestation that the tarball was built by this
    # workflow, from this repository, at this commit. A tag is a mutable pointer: `@v4` is
    # whatever `v4` names on the day it runs, so the workflow being attested to could change
    # under the attestation. The `# v4` comment keeps it readable, and dependabot rewrites the
    # SHA when there is something to move to.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "${RELEASE_TAG}" != "${expected}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match package version ${expected}."
            exit 1
          fi
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      # prepublishOnly reruns the build and the suite, so a broken commit cannot ship.
      #
      # Retried, because the two failures seen so far were neither the code's nor the tarball's.
      # Publishing a batch of releases together made one run die on `E409 Conflict - Failed to
      # save packument`, which is the registry refusing a write while another is in flight; a
      # later one died on `CA_CREATE_SIGNING_CERTIFICATE_ERROR - (403) Forbidden`, which is
      # Sigstore declining to mint the provenance certificate. Both passed on a manual rerun.
      #
      # The registry is asked before retrying, so this can never publish twice: if the version is
      # already there, the write succeeded and whatever failed came after it.
      - name: Publish
        run: |
          version="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3; do
            if npm publish --provenance --access public; then exit 0; fi
            if npm view "edf2csv@${version}" version >/dev/null 2>&1; then
              echo "edf2csv@${version} is on the registry; the write landed and the failure came after it."
              exit 0
            fi
            echo "Attempt ${attempt} failed with nothing published; retrying in $((attempt * 20))s."
            sleep $((attempt * 20))
          done
          echo "Three attempts failed and ${version} is not on the registry."
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
